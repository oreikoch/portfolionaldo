<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ativamente — Reinaldo Koch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #1e1e20;
      --bg-elev: #232326;
      --text-light: #f1f1f3;
      --text-muted: #9d9ea1;
      --accent: #ffb100;
      --border: rgba(255, 255, 255, .08);
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg-main);
      color: var(--text-light);
      min-height: 100vh;
    }
    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 25px 20px 0;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: .85rem;
      margin-bottom: 18px;
      transition: color .2s ease;
    }
    .back-link:hover { color: var(--accent); }
    .title-block { margin-bottom: 20px; }
    .eyebrow {
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }
    h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 6px; }
    .subtitle { color: var(--text-muted); font-size: .92rem; max-width: 640px; }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px 20px 50px;
    }
    .embed-box {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .embed-box iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: block;
    }
    .open-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      background: var(--accent);
      color: #1e1e20;
      text-decoration: none;
      font-weight: 600;
      font-size: .85rem;
      padding: 12px 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../index.html">&larr; Voltar ao portfólio</a>
    <div class="title-block">
      <p class="eyebrow">Projeto Figma</p>
      <h1>Ativamente</h1>
      <p class="subtitle">Apresentação do projeto Ativamente, navegável diretamente no Figma.</p>
    </div>
  </header>
  <main>
    <div class="embed-box">
      <iframe src="https://embed.figma.com/design/uGEmHk0qk3EJFdb4LOtVhq/APRESENTA%C3%87%C3%83O-ATIVAMENTE?node-id=1-2&embed-host=share" allowfullscreen></iframe>
    </div>
    <a class="open-link" href="https://www.figma.com/design/uGEmHk0qk3EJFdb4LOtVhq/APRESENTA%C3%87%C3%83O-ATIVAMENTE?node-id=1-2" target="_blank" rel="noopener">Abrir no Figma ↗</a>
  </main>
</body>
</html>
